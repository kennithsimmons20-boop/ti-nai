<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nspire USB test</title>
<style>
  :root { --bg:#f6f7f4; --fg:#1d2320; --muted:#5d6762; --line:#cfd5d0; --ok:#16794a; --bad:#b3261e; --btn:#1d2320; --btnfg:#f6f7f4; --log:#ecefe9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161a18; --fg:#e6eae7; --muted:#9aa5a0; --line:#2f3733; --ok:#5fd39a; --bad:#ff8a80; --btn:#e6eae7; --btnfg:#161a18; --log:#1e2421; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width: 44rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  p { margin: .25rem 0 1rem; color: var(--muted); }
  .row { display:flex; gap:.6rem; flex-wrap:wrap; margin: 1rem 0; }
  button { font:inherit; padding:.6rem 1rem; border-radius:6px; border:1px solid var(--fg); background:var(--btn); color:var(--btnfg); cursor:pointer; }
  button.alt { background:transparent; color:var(--fg); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button:focus-visible { outline:3px solid var(--ok); outline-offset:2px; }
  #status { font-weight:600; }
  #log { background:var(--log); border:1px solid var(--line); border-radius:6px; padding:.75rem; height:22rem; overflow:auto; font:13px/1.45 ui-monospace, Menlo, monospace; white-space:pre-wrap; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Nspire USB test</h1>
  <p>Plug the calculator into the Chromebook, turn it on and leave it on the home screen. Then press Connect and pick it from the list.</p>
  <p id="status">Not connected</p>
  <div class="row">
    <button id="connect">Connect calculator</button>
    <button id="any" class="alt">Show all USB devices</button>
    <button id="disconnect" class="alt" disabled>Disconnect</button>
    <button id="copy" class="alt">Copy log</button>
  </div>
  <div id="log" role="log" aria-live="polite"></div>
</main>
<script>
const NSPIRE_VID = 0x0451;
const NSPIRE_PIDS = { 0xE012: 'TI-Nspire CX', 0xE022: 'TI-Nspire CX II' };
const $ = id => document.getElementById(id);
const logEl = $('log');
let dev = null;

function log(msg, cls) {
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}
const hex = (n, w = 4) => '0x' + n.toString(16).padStart(w, '0');
function setStatus(t, cls) { const s = $('status'); s.textContent = t; s.className = cls || ''; }

if (!('usb' in navigator)) {
  setStatus('WebUSB is not available in this browser. Use Chrome on ChromeOS over https.', 'bad');
  $('connect').disabled = $('any').disabled = true;
}

async function pick(showAll) {
  try {
    const opts = showAll ? { filters: [] } : { filters: [{ vendorId: NSPIRE_VID }] };
    dev = await navigator.usb.requestDevice(opts);
    await inspect(dev);
  } catch (e) {
    log('Request failed: ' + e.message, 'bad');
    if (/No device selected/i.test(e.message)) log('No calculator showed up in the list. Try "Show all USB devices" and tell me what appears.');
  }
}

async function inspect(d) {
  log('Selected: ' + (d.productName || '(no name)') + '  vendor ' + hex(d.vendorId) + '  product ' + hex(d.productId));
  if (d.vendorId === NSPIRE_VID && NSPIRE_PIDS[d.productId]) log('Recognized as ' + NSPIRE_PIDS[d.productId], 'ok');
  try {
    await d.open();
    log('Opened device', 'ok');
    if (d.configuration === null) { await d.selectConfiguration(1); log('Selected configuration 1'); }
    for (const cfg of d.configurations) {
      log('Configuration ' + cfg.configurationValue);
      for (const ifc of cfg.interfaces) {
        for (const alt of ifc.alternates) {
          log('  Interface ' + ifc.interfaceNumber + ' alt ' + alt.alternateSetting + '  class ' + hex(alt.interfaceClass, 2) + '  subclass ' + hex(alt.interfaceSubclass, 2) + '  protocol ' + hex(alt.interfaceProtocol, 2));
          for (const ep of alt.endpoints) {
            log('    Endpoint ' + hex(ep.endpointNumber, 2) + '  ' + ep.direction + '  ' + ep.type + '  max packet ' + ep.packetSize);
          }
        }
      }
    }
    const first = d.configuration.interfaces[0];
    try {
      await d.claimInterface(first.interfaceNumber);
      log('Claimed interface ' + first.interfaceNumber, 'ok');
      setStatus('Connected: ' + (d.productName || 'USB device'), 'ok');
      $('disconnect').disabled = false;
    } catch (e) {
      log('Could not claim interface ' + first.interfaceNumber + ': ' + e.message, 'bad');
      setStatus('Opened, but the interface is blocked', 'bad');
    }
  } catch (e) {
    log('Open failed: ' + e.message, 'bad');
    setStatus('Could not open the device', 'bad');
  }
}

$('connect').onclick = () => pick(false);
$('any').onclick = () => pick(true);
$('disconnect').onclick = async () => {
  if (!dev) return;
  try { await dev.close(); } catch (e) {}
  log('Disconnected');
  setStatus('Not connected');
  $('disconnect').disabled = true;
  dev = null;
};
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(logEl.innerText); log('Log copied'); }
  catch (e) { log('Copy failed: ' + e.message, 'bad'); }
};
if ('usb' in navigator) {
  navigator.usb.addEventListener('disconnect', e => {
    if (e.device === dev) { log('Calculator unplugged', 'bad'); setStatus('Not connected'); $('disconnect').disabled = true; dev = null; }
  });
}
</script>
</body>
</html>
