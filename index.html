<title>Nspire Gemini bridge</title>
<style>

  }

  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }

  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }

  button { font:inherit; padding:.55rem .95rem; border-radius:6px; border:1px solid var(--fg); background:var(--btn); color:var(--btnfg); cursor:pointer; }
  button.alt { background:transparent; color:var(--fg); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--ok); outline-offset:2px; }
  input { font:inherit; padding:.5rem .6rem; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); flex:1 1 14rem; min-width:0; }
  #status { font-weight:600; }
  #log { background:var(--log); border:1px solid var(--line); border-radius:6px; padding:.75rem; height:24rem; overflow:auto; font:13px/1.45 ui-monospace, Menlo, monospace; white-space:pre-wrap; word-break:break-all; }

</style>

<main>
  <h1>Nspire Gemini bridge</h1>
  <p>Plug in the calculator, turn it on, and stay on the home screen. Connect first, then try the other buttons one at a time.</p>
  <p id="status">Not connected</p>
  <div class="row">
    <button id="connect">Connect calculator</button>
    <button id="info" class="alt" disabled>Read device info</button>
    <button id="disconnect" class="alt" disabled>Disconnect</button>
    <button id="copy" class="alt">Copy log</button>
  </div>
  <div class="row">
    <input id="dirPath" value="/" aria-label="Folder path" spellcheck="false">
    <button id="list" class="alt" disabled>List folder</button>
  </div>

    <input id="filePath" value="/reply.txt.tns" aria-label="File path" spellcheck="false">
    <button id="read" class="alt" disabled>Read file</button>
    <button id="download" class="alt" disabled>Download file</button>
  </div>
  <div class="row">
    <input id="fileText" value="hello from the Chromebook" aria-label="Text to write" spellcheck="false">
    <button id="write" class="alt" disabled>Write file</button>
    <button id="diag" class="alt" disabled>Run write diagnostics</button>
  </div>
  <div class="row">
    <input id="fileInput" type="file" aria-label="File to send to the calculator">
    <button id="sendFile" class="alt" disabled>Send file to calculator</button>
  </div>
  <div class="row">
    <input id="apiKey" type="password" placeholder="Gemini API key" aria-label="Gemini API key" autocomplete="off">
    <input id="model" value="gemini-2.5-flash" aria-label="Gemini model name">
  </div>
  <div class="row"><button id="bridge" disabled>Start bridge</button>
    <button id="testNotes" class="alt" disabled>Write test notes document</button></div>
  <div id="log" role="log" aria-live="polite"></div>
</main>

const TNS_KEYS=[[0x16,0xA7,0xA7,0x32,0x68,0xA7,0xBA,0x73],[0xD9,0xA8,0x86,0xA4,0x34,0x45,0x94,0x10],[0x3D,0x80,0x8C,0xB5,0xDF,0xB3,0x80,0x6B]].map(k=>desSubkeys(k));
function tnsCrypt(data){ // XOR with a 3DES-encrypted counter stream
  const out=new Uint8Array(data);
  for(let blk=0;blk*8<out.length;blk++){
    const cur=(0x6fe21307+(blk%1024))>>>0,iv=[0,0,0,0,cur&255,(cur>>8)&255,(cur>>16)&255,(cur>>>24)&255];
    let x=desBlock(iv,TNS_KEYS[0],false);x=desBlock(x,TNS_KEYS[1],true);x=desBlock(x,TNS_KEYS[2],false);
    for(let i=0;i<8&&blk*8+i<out.length;i++)out[blk*8+i]^=x[i];
  }
  return out;
}
function tnsXmlCompress(xml){
  const st=xml.search(/<prob|<doc/);if(st<0)throw new Error('not a problem XML');
  const s=xml.slice(st),stack=[];let out='',last=0,i=0;
  while(i<s.length){
    const c=s[i];
    if(c==='<'){
      if(s[i+1]==='/'){const idx=stack.pop(),end=s.indexOf('>',i);out+=idx<256?'\x0E'+String.fromCharCode(idx):s.slice(i,end+1);i=end+1;continue;}
      if(s[i+1]==='!'){const end=s.indexOf(']]>',i);out+=s.slice(i,end+3);i=end+3;continue;}
      stack.push(last++);
    }
    out+=c;i++;
  }
  return 'TIXC0100-1.0?>'+out;
}
function crc32(b){let c,crc=0xFFFFFFFF;for(let n=0;n<b.length;n++){c=(crc^b[n])&255;for(let k=0;k<8;k++)c=c&1?(c>>>1)^0xEDB88320:c>>>1;crc=(crc>>>8)^c;}return (crc^0xFFFFFFFF)>>>0;}
function tnsZip(files){ // files: [{name, data:Uint8Array}], TI method 13
  const le16=v=>[v&255,(v>>8)&255],le32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255],te=new TextEncoder();
  const body=[],cd=[];let off=0;
  files.forEach((f,idx)=>{
    const name=Array.from(te.encode(f.name)),crc=crc32(f.data),n=f.data.length;
    const sig=idx===0?Array.from(te.encode('*TIMLP0500')):[0x50,0x4B,3,4];
    const lh=[...sig,...le16(20),...le16(0),...le16(13),...le16(0),...le16(0x20),...le32(crc),...le32(n),...le32(n),...le16(name.length),...le16(0),...name];
    body.push(Uint8Array.from(lh),f.data);
    cd.push(Uint8Array.from([0x50,0x4B,1,2,...le16(0),...le16(20),...le16(0),...le16(13),...le16(0),...le16(0x20),...le32(crc),...le32(n),...le32(n),...le16(name.length),...le16(0),...le16(0),...le16(0),...le16(0),...le32(0),...le32(off),...name]));
    off+=lh.length+n;
  });
  const cdSize=cd.reduce((a,c)=>a+c.length,0);
  const end=Uint8Array.from([0x54,0x49,0x50,0x44,...le16(0),...le16(0),...le16(files.length),...le16(files.length),...le32(cdSize),...le32(off),...le16(0)]);
  const parts=[...body,...cd,end],all=new Uint8Array(parts.reduce((a,p)=>a+p.length,0));let o=0;for(const p of parts){all.set(p,o);o+=p.length;}return all;
}
async function rawDeflate(bytes){
  const cs=new CompressionStream('deflate-raw'),w=cs.writable.getWriter();w.write(bytes);w.close();
  return new Uint8Array(await new Response(cs.readable).arrayBuffer());
}
const TNS_PROB_HEADER=Uint8Array.from([0x0F,0xCE,0xD8,0xD2,0x81,0x06,0x86,0x5B,0x99,0xDD,0xA2,0x3D,0xD9,0xE9,0x4B,0xD4,0x31,0xBB,0x50,0xB6,0x4D,0xB3,0x29,0x24,0x70,0x60,0x49,0x38,0x1C,0x30,0xF8,0x99,0x00,0x4B,0x92,0x64,0xE4,0x58,0xE6,0xBC]);
function tnsNotesXml(text){
  const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const wrapLine=(line,w)=>{const out=[];let cur='';for(const word of line.split(/\s+/).filter(Boolean)){if(cur&&cur.length+1+word.length>w){out.push(cur);cur=word;}else cur=cur?cur+' '+word:word;}if(cur)out.push(cur);return out;};
  const paras=[];
  for(const line of text.replace(/\r/g,'').split('\n')){
    if(!line.trim()){paras.push('<node name="1para"><node name="1rtline"><leaf name="1word"> </leaf></node></node>');continue;}
    for(const row of wrapLine(line,48))paras.push('<node name="1para"><node name="1rtline">'+row.split(' ').map(w=>'<leaf name="1word">'+esc(w)+' </leaf>').join('')+'</node></node>');
  }
  const tree='<r2dtotree><node name="1doc">'+paras.join('')+'</node></r2dtotree>';
  return '<?xml version="1.0" encoding="UTF-8" ?>\n<prob xmlns="urn:TI.Problem" ver="1.0" pbname=""><sym></sym><card clay="0" h1="10000" h2="10000" w1="10000" w2="10000"><isDummyCard>0</isDummyCard><flag>0</flag><wdgt xmlns:np="urn:TI.Notepad" type="TI.Notepad" ver="2.0"><np:mFlags>1024</np:mFlags><np:value>'+text.length+'</np:value><np:fmtxt>'+esc(tree)+'</np:fmtxt></wdgt></card></prob>';
}
async function makeNotesTns(text,variant){
  const comp=tnsXmlCompress(tnsNotesXml(text,variant)),bytes=Uint8Array.from(comp,ch=>ch.charCodeAt(0));
  const enc=tnsCrypt(await rawDeflate(bytes)),prob=new Uint8Array(TNS_PROB_HEADER.length+enc.length);
  prob.set(TNS_PROB_HEADER);prob.set(enc,TNS_PROB_HEADER.length);
  const doc=Uint8Array.from(atob(TNS_DOC_B64),ch=>ch.charCodeAt(0));
  return tnsZip([{name:'Document.xml',data:doc},{name:'Problem1.xml',data:prob}]);
}

const PROMPT = '/gemprompt.txt.tns', REPLY = '/gemreply.txt.tns', NOTES = '/Gemini answer.tns';
async function saveNotes(text, name, variant) {
  const doc = await makeNotesTns(text, variant), path = name || NOTES;
  try { await nsp.deleteFile(path); } catch (e) { nsp.connected = false; }
  await nsp.writeFile(path, doc);
}
let bridgeOn = false, loopId = 0;
try { $('apiKey').value = localStorage.getItem('gemKey') || ''; } catch (e) {}
async function askGemini(prompt) {
  const key = $('apiKey').value.trim(), model = $('model').value.trim();
  try { localStorage.setItem('gemKey', key); } catch (e) {}
  const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(key), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: 'You answer for a small calculator screen. Reply in plain ASCII text only, no markdown, no lists with symbols, at most 600 characters.' }] },
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { maxOutputTokens: 500 }
    })
  });
  const j = await res.json();
  if (!res.ok) throw new Error('Gemini: ' + ((j.error && j.error.message) || res.status));
  const text = ((j.candidates || [])[0]?.content?.parts || []).map(p => p.text || '').join('');
  return (text || 'No answer.').replace(/[\u2018\u2019]/g, "'").replace(/[\u201c\u201d]/g, '"').replace(/[*#`]/g, '').replace(/[^\x20-\x7E\n]/g, '?').slice(0, 1500);
}
async function bridgeLoop() {
  const myId = ++loopId;
  let polls = 0, staleKey = null;
  while (bridgeOn && nsp && myId === loopId) {
    if (++polls % 10 === 0) log('Still watching for a prompt (' + polls + ' checks)');
    try {
      let bytes = null;
      try { bytes = await nsp.readFile(PROMPT); } catch (e) { if (!/not found/.test(e.message)) throw e; }
      if (!bytes) staleKey = null;
      if (bytes) {
        const prompt = dec.decode(bytes).trim();
        const skip = prompt === staleKey;
        if (!skip) { try { await nsp.deleteFile(PROMPT); } catch (e) { log('Could not delete the prompt file (' + e.message + '), carrying on'); nsp.connected = false; staleKey = prompt; } }
        if (prompt && !skip) {
          log('Prompt: ' + prompt);
          const ans = await askGemini(prompt);
          try { await nsp.deleteFile(REPLY); } catch (e) { nsp.connected = false; }
          await nsp.writeFile(REPLY, enc.encode(ans.length + '\n' + ans));
          log('Answer sent (' + ans.length + ' characters). Choose Check on the calculator.', 'ok');
          try { await saveNotes('Q: ' + prompt + '\n\nA: ' + ans); log('Notes document updated', 'ok'); }
          catch (e) { log('Notes document failed: ' + e.message, 'bad'); nsp.connected = false; }
        }
      }
    } catch (e) { log('Bridge error: ' + e.message, 'bad'); if (nsp) nsp.connected = false; await sleep(3000); }
    await sleep(2000);
  }
}
$('bridge').onclick = () => {
  bridgeOn = !bridgeOn;
  $('bridge').textContent = bridgeOn ? 'Stop bridge' : 'Start bridge';
  if (bridgeOn) { if (!$('apiKey').value.trim()) { log('Enter your Gemini API key first', 'bad'); bridgeOn = false; $('bridge').textContent = 'Start bridge'; return; } log('Bridge running. Waiting for a prompt from the calculator...', 'ok'); bridgeLoop(); }
  else log('Bridge stopped');
};
// ---- UI ----
let usbDev = null, nsp = null;
const needsLink = ['info', 'list', 'read', 'write', 'diag', 'bridge', 'testNotes', 'download', 'sendFile', 'disconnect'];
function enable(on) { needsLink.forEach(id => { $(id).disabled = !on; }); }
async function guard(label, fn) {
  try { return await fn(); }
  catch (e) { log(label + ' failed: ' + e.message, 'bad'); nsp && (nsp.connected = false); }
}
if (!('usb' in navigator)) { setStatus('WebUSB is not available. Use Chrome or ChromeOS over https.', 'bad'); $('connect').disabled = true; }

$('connect').onclick = () => guard('Connect', async () => {
  usbDev = await navigator.usb.requestDevice({ filters: [{ vendorId: 0x0451, productId: 0xE012 }] });
  await usbDev.open();
  if (!usbDev.configuration || usbDev.configuration.configurationValue !== 1) await usbDev.selectConfiguration(1);
  await usbDev.claimInterface(0);
  nsp = new Nspire(usbDev);
  log('Interface claimed. Waiting for the calculator to ask for an address...');
  try { await nsp.recvPacket(2500); log('Got the address request', 'ok'); }
  catch (e) {
    log('No request yet (' + e.message + '). Resetting the USB link and trying again.');
    try { await usbDev.reset(); } catch (er) { log('reset: ' + er.message, 'bad'); }
    try { await usbDev.claimInterface(0); } catch (er) { /* may still be claimed */ }
    nsp.pending = null;
    await nsp.recvPacket(8000);
    log('Got the address request', 'ok');
  }
  const p = nsp.newPacket(); p.data = [0x64, 0x01, 0xFF, 0x00];
  await nsp.sendPacket(p); nsp.hostSid = 0x8000;
  setStatus('Connected to the calculator', 'ok'); enable(true);
  log('Handshake sent. Try "Read device info" next.', 'ok');
});
$('info').onclick = () => guard('Device info', () => nsp.deviceInfo());
$('list').onclick = () => guard('List folder', () => nsp.listDir($('dirPath').value.trim() || '/'));
$('read').onclick = () => guard('Read file', async () => {
  const bytes = await nsp.readFile($('filePath').value.trim());
  log('Read ' + bytes.length + ' bytes: ' + dec.decode(bytes), 'ok');
});
$('write').onclick = () => guard('Write file', async () => {
  const path = $('filePath').value.trim(), text = $('fileText').value;
  await nsp.writeFile(path, enc.encode(text));
  log('Wrote ' + text.length + ' bytes to ' + path + '. Check the calculator\'s Documents screen.', 'ok');
});
$('diag').onclick = () => guard('Diagnostics', async () => {
  const tests = [
    ['/nsp10.tns', 'x'.repeat(300), true],
    ['/nsp11.tns', 'abcdefghij'.repeat(100), false]
  ];
  for (const [path, text, trace] of tests) {
    log('--- writing ' + path + ' (' + text.length + ' bytes)');
    traceOn = trace;
    let failed = false;
    try { await nsp.writeFile(path, enc.encode(text)); log('upload confirmed', 'ok'); }
    catch (e) { log('write result: ' + e.message, 'bad'); failed = true; }
    traceOn = false;
    if (failed) { log('Stopping here. Reload the page and reconnect before trying again.', 'bad'); break; }
    try { const back = await nsp.readFile(path); log('read back ' + back.length + ' bytes', 'ok'); }
    catch (e) { log('read-back: ' + e.message, 'bad'); break; }
  }
  log('--- diagnostics done.', 'ok');
});
$('testNotes').onclick = () => guard('Test notes', async () => {
  if (bridgeOn) { log('Stop the bridge first', 'bad'); return; }
  await saveNotes('Q: test question\n\nA: Hello world from Gemini. If you can read this in the Notes app, the format works.', '/Notes test.tns');
  log('Wrote /Notes test.tns. Open it from the calculator Documents screen.', 'ok');
});
$('download').onclick = () => guard('Download', async () => {
  if (bridgeOn) { log('Stop the bridge first', 'bad'); return; }
  const path = $('filePath').value.trim(), bytes = await nsp.readFile(path);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/octet-stream' }));
  a.download = path.split('/').pop() || 'file.tns';
  document.body.appendChild(a); a.click(); a.remove();
  log('Downloaded ' + a.download + ' (' + bytes.length + ' bytes)', 'ok');
});
$('sendFile').onclick = () => guard('Send file', async () => {
  if (bridgeOn) { log('Stop the bridge before sending a file', 'bad'); return; }
  const f = $('fileInput').files[0];
  if (!f) { log('Choose a file first', 'bad'); return; }
  const bytes = new Uint8Array(await f.arrayBuffer()), path = '/' + f.name;
  log('Sending ' + f.name + ' (' + bytes.length + ' bytes). This can take a few seconds...');
  try { await nsp.deleteFile(path); } catch (e) { nsp.connected = false; }
  await nsp.writeFile(path, bytes);
  log('Sent to ' + path + '. Find it in the calculator\'s Documents screen.', 'ok');
});
$('disconnect').onclick = async () => {
  bridgeOn = false; $('bridge').textContent = 'Start bridge';
  try { await usbDev.close(); } catch (e) {}
  usbDev = nsp = null; enable(false); setStatus('Not connected'); log('Disconnected');
};
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(logEl.innerText); log('Log copied'); }
  catch (e) { log('Copy failed: ' + e.message, 'bad'); }
};
if ('usb' in navigator) navigator.usb.addEventListener('disconnect', e => {
  if (e.device === usbDev) { log('Calculator unplugged', 'bad'); usbDev = nsp = null; enable(false); setStatus('Not connected'); }
});
</script>
</body>
</html>
