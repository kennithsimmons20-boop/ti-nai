<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nspire link test, stage 2</title>
<style>
  :root { --bg:#f6f7f4; --fg:#1d2320; --muted:#5d6762; --line:#cfd5d0; --ok:#16794a; --bad:#b3261e; --btn:#1d2320; --btnfg:#f6f7f4; --log:#ecefe9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161a18; --fg:#e6eae7; --muted:#9aa5a0; --line:#2f3733; --ok:#5fd39a; --bad:#ff8a80; --btn:#e6eae7; --btnfg:#161a18; --log:#1e2421; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width: 46rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  p { margin: .25rem 0 1rem; color: var(--muted); }
  .row { display:flex; gap:.6rem; flex-wrap:wrap; margin: .75rem 0; align-items:center; }
  button { font:inherit; padding:.55rem .95rem; border-radius:6px; border:1px solid var(--fg); background:var(--btn); color:var(--btnfg); cursor:pointer; }
  button.alt { background:transparent; color:var(--fg); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--ok); outline-offset:2px; }
  input { font:inherit; padding:.5rem .6rem; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); flex:1 1 14rem; min-width:0; }
  #status { font-weight:600; }
  #log { background:var(--log); border:1px solid var(--line); border-radius:6px; padding:.75rem; height:24rem; overflow:auto; font:13px/1.45 ui-monospace, Menlo, monospace; white-space:pre-wrap; word-break:break-all; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Nspire link test, stage 2</h1>
  <p>Plug in the calculator, turn it on, and stay on the home screen. Connect first, then try the other buttons one at a time.</p>
  <p id="status">Not connected</p>
  <div class="row">
    <button id="connect">Connect calculator</button>
    <button id="info" class="alt" disabled>Read device info</button>
    <button id="disconnect" class="alt" disabled>Disconnect</button>
    <button id="copy" class="alt">Copy log</button>
  </div>
  <div class="row">
    <input id="dirPath" value="/" aria-label="Folder path" spellcheck="false">
    <button id="list" class="alt" disabled>List folder</button>
  </div>
  <div class="row">
    <input id="filePath" value="/reply.txt.tns" aria-label="File path" spellcheck="false">
    <button id="read" class="alt" disabled>Read file</button>
  </div>
  <div class="row">
    <input id="fileText" value="hello from the Chromebook" aria-label="Text to write" spellcheck="false">
    <button id="write" class="alt" disabled>Write file</button>
    <button id="diag" class="alt" disabled>Run write diagnostics</button>
  </div>
  <div id="log" role="log" aria-live="polite"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const logEl = $('log');
function log(msg, cls) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = msg; log.last = msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}
const hex = (b, n = 64) => Array.from(b.slice(0, n), x => x.toString(16).padStart(2, '0')).join(' ') + (b.length > n ? ' ...' : '');
const sleep = ms => new Promise(r => setTimeout(r, ms));
function setStatus(t, cls) { const s = $('status'); s.textContent = t; s.className = cls || ''; }
const enc = new TextEncoder(), dec = new TextDecoder();

// ---- Packet layer (ported from libnspire packet.c) ----
function dataChecksum(bytes) {
  let c = 0;
  for (const b of bytes) {
    const t1 = ((b << 8) | (c >> 8)) & 0xFFFF;
    c &= 0xFF;
    const t2 = ((((c & 0xF) << 4) ^ c) << 8) & 0xFFFF;
    const t3 = (t2 >> 5) & 0xFFFF;
    c = (t3 >> 7) & 0xFFFF;
    c = (c ^ t1 ^ t2 ^ t3) & 0xFFFF;
  }
  return c;
}

class Nspire {
  constructor(dev) {
    this.dev = dev;
    this.hostAddr = 0x6400; this.devAddr = 0x6401;
    this.hostSid = 0x4003; this.devSid = 0x4003;
    this.seq = 1; this.connected = false; this.pending = null;
  }
  newPacket() {
    return { srcAddr: this.hostAddr, srcSid: this.hostSid, dstAddr: this.devAddr, dstSid: this.devSid, seq: this.seq, ack: 0, data: [] };
  }
  async sendPacket(p) {
    const data = Uint8Array.from(p.data);
    if (data.length > 254) throw new Error('packet data too large');
    const out = new Uint8Array(16 + data.length);
    const v = new DataView(out.buffer);
    v.setUint16(0, 0x54FD); v.setUint16(2, p.srcAddr); v.setUint16(4, p.srcSid);
    v.setUint16(6, p.dstAddr); v.setUint16(8, p.dstSid);
    v.setUint16(10, dataChecksum(data));
    out[12] = data.length; out[13] = p.ack; out[14] = p.seq;
    let s = 0; for (let i = 0; i < 15; i++) s = (s + out[i]) & 0xFF;
    out[15] = s;
    out.set(data, 16);
    this.trace && log('OUT ' + hex(out), '');
    const r = await this.dev.transferOut(1, out);
    if (r.status !== 'ok') throw new Error('transferOut ' + r.status);
  }
  async recvPacket(timeoutMs = 10000) {
    if (!this.pending) {
      let pr;
      pr = this.dev.transferIn(1, 1460).then(
        r => { if (this.pending === pr) this.pending = null; return r; },
        e => { if (this.pending === pr) this.pending = null; throw e; });
      pr.catch(() => {});
      this.pending = pr;
    }
    let timer;
    const r = await Promise.race([this.pending, new Promise((_, rej) => { timer = setTimeout(() => rej(new Error('timeout')), timeoutMs); })]);
    clearTimeout(timer);
    if (r.status !== 'ok') throw new Error('transferIn ' + r.status);
    const b = new Uint8Array(r.data.buffer, r.data.byteOffset, r.data.byteLength);
    this.trace && log('IN  ' + hex(b), '');
    if (b.length < 16) throw new Error('short packet (' + b.length + ' bytes)');
    const v = new DataView(b.buffer, b.byteOffset, b.byteLength);
    if (v.getUint16(0) !== 0x54FD) throw new Error('bad magic');
    let s = 0; for (let i = 0; i < 15; i++) s = (s + b[i]) & 0xFF;
    if (s !== b[15]) throw new Error('bad header checksum');
    const size = b[12];
    if (size === 0xFF) throw new Error('big packets are not supported on the CX');
    const data = b.slice(16, 16 + size);
    if (dataChecksum(data) !== v.getUint16(10)) throw new Error('bad data checksum');
    return { srcAddr: v.getUint16(2), srcSid: v.getUint16(4), dstAddr: v.getUint16(6), dstSid: v.getUint16(8), ack: b[13], seq: b[14], data };
  }
  ackFor(p, nack) {
    const a = this.newPacket();
    a.srcSid = nack ? 0xD3 : (p.seq ? 0xFF : 0xFE);
    a.dstSid = p.srcSid; a.seq = p.seq; a.ack = 0x0A;
    a.data = [p.dstSid >> 8, p.dstSid & 0xFF];
    return a;
  }
  async handleUnknown(p) {
    await this.sendPacket(this.ackFor(p, p.dstSid !== 0x40DE));
  }
  // ---- Data layer (ported from data.c) ----
  async dataWrite(bytes, mod) {
    const p = this.newPacket();
    p.data = Array.from(bytes);
    if (mod) mod(p);
    await this.sendPacket(p);
    for (;;) {
      const r = await this.recvPacket();
      if (r.dstSid === this.hostSid) {
        if (r.srcSid === 0xFF || r.srcSid === 0xFE) { this.seq = (this.seq + 1) & 0xFF; if (!this.seq) this.seq++; return; }
        if (r.srcSid === 0xD3) throw new Error('calculator rejected the packet');
      } else {
        await this.handleUnknown(r);
      }
    }
  }
  async dataRead(timeoutMs) {
    for (;;) {
      const r = await this.recvPacket(timeoutMs);
      if (r.dstSid === this.hostSid) { await this.sendPacket(this.ackFor(r, false)); return r.data; }
      await this.handleUnknown(r);
    }
  }
  // ---- Services (ported from service.c) ----
  serviceConnect(sid) {
    if (this.connected) throw new Error('service busy');
    this.connected = true; this.devSid = sid;
  }
  async serviceDisconnect() {
    if (!this.connected) return;
    await this.dataWrite([this.hostSid >> 8, this.hostSid & 0xFF], p => { p.srcSid = 0x40DE; });
    this.connected = false; this.hostSid++;
  }
  async with(sid, fn) {
    this.serviceConnect(sid);
    try { return await fn(); }
    finally { try { await this.serviceDisconnect(); } catch (e) { this.connected = false; log('disconnect step: ' + e.message, 'bad'); } }
  }
  async handshake() {
    await this.recvPacket(8000);                         // address request from calculator
    const p = this.newPacket();
    p.data = [0x64, 0x01, 0xFF, 0x00];
    await this.sendPacket(p);
    this.hostSid = 0x8000;
  }
}
function cstr(buf, off) {          // 's' padding rule: strings take at least 9 bytes
  let end = off; while (end < buf.length && buf[end] !== 0) end++;
  const n = end - off;
  return { str: dec.decode(buf.slice(off, end)), next: off + Math.max(n, 8) + 1 };
}
function buildPath(prefix, path, tail) {   // 'bs0' / 'hs' style
  const pb = enc.encode(path);
  const out = [...prefix, ...pb];
  for (let i = pb.length; i < 8; i++) out.push(0);
  out.push(0, ...tail);
  return out;
}
const u32 = (b, o) => ((b[o] << 24) | (b[o + 1] << 16) | (b[o + 2] << 8) | b[o + 3]) >>> 0;
const ver = (b, o) => b[o] + '.' + b[o + 1] + '.' + ((b[o + 2] << 8) | b[o + 3]);

Nspire.prototype.deviceInfo = function () {
  return this.with(0x4020, async () => {
    await this.dataWrite([0x01]);
    const a = await this.dataRead();
    const i = a.slice(1);
    const big = o => { let n = 0n; for (let k = 0; k < 8; k++) n = (n << 8n) | BigInt(i[o + k]); return n; };
    log('OS ' + ver(i, 36) + '   boot1 ' + ver(i, 40) + '   boot2 ' + ver(i, 44), 'ok');
    log('Storage free ' + big(0) + ' of ' + big(8) + ' bytes, RAM free ' + big(16) + ' of ' + big(24) + ' bytes');
    log('Battery level ' + i[32] + ', charging ' + i[34] + ', screen ' + ((i[58] << 8) | i[59]) + ' wide');
    await this.dataWrite([0x02]);
    const b = await this.dataRead();
    log('Device name: ' + cstr(b, 1).str);
  });
};
Nspire.prototype.listDir = function (path) {
  return this.with(0x4060, async () => {
    await this.dataWrite(buildPath([0x0D], path, [0]));
    const r = await this.dataRead();
    if (r[1] === 0x0A) { log('Folder not found: ' + path, 'bad'); return; }
    if (r[1] === 0x0F) { log('Invalid path: ' + path, 'bad'); return; }
    let n = 0;
    for (;;) {
      await this.dataWrite([0x0E]);
      const e = await this.dataRead();
      if (e[0] === 0xFF) break;
      const s = cstr(e, 3);
      const size = u32(e, s.next), isDir = e[s.next + 8];
      log((isDir ? '[folder] ' : '[file]   ') + s.str + (isDir ? '' : '   ' + size + ' bytes'));
      if (++n > 500) break;
    }
    log(n + ' item(s) in ' + path, 'ok');
    await this.dataWrite([0x0F]);
    await this.dataRead();
  });
};
Nspire.prototype.readFile = function (path) {
  return this.with(0x4060, async () => {
    await this.dataWrite(buildPath([0x07, 0x01], path, []));
    const h = await this.dataRead();
    if (((h[0] << 8) | h[1]) !== 0x0301) throw new Error('file not found');
    let left = u32(h, 11);
    await this.dataWrite([0x04]);
    const parts = [];
    while (left > 0) {
      const d = await this.dataRead();
      const chunk = d.slice(1);
      if (!chunk.length) throw new Error('empty chunk');
      parts.push(chunk); left -= chunk.length;
    }
    await this.dataWrite([0xFF, 0x00]);
    const all = new Uint8Array(parts.reduce((a, c) => a + c.length, 0));
    let o = 0; for (const c of parts) { all.set(c, o); o += c.length; }
    return all;
  });
};
Nspire.prototype.writeFile = function (path, bytes) {
  return this.with(0x4060, async () => {
    const size = bytes.length;
    const head = buildPath([0x03, 0x01], path, []);
    head.push((size >>> 24) & 255, (size >>> 16) & 255, (size >>> 8) & 255, size & 255);
    await this.dataWrite(head);
    const r = await this.dataRead();
    if (r[0] !== 0x04) throw new Error('calculator refused the upload (' + hex(r, 8) + ')');
    for (let o = 0; o < size; o += 253) await this.dataWrite([0x05, ...bytes.slice(o, o + 253)]);
    const done = await this.dataRead(40000);
    if (((done[0] << 8) | done[1]) !== 0xFF00) throw new Error('upload not confirmed (' + hex(done, 8) + ')');
  });
};

// ---- UI ----
let usbDev = null, nsp = null;
const needsLink = ['info', 'list', 'read', 'write', 'diag', 'disconnect'];
function enable(on) { needsLink.forEach(id => { $(id).disabled = !on; }); }
async function guard(label, fn) {
  try { return await fn(); }
  catch (e) { log(label + ' failed: ' + e.message, 'bad'); nsp && (nsp.connected = false); }
}
if (!('usb' in navigator)) { setStatus('WebUSB is not available. Use Chrome or ChromeOS over https.', 'bad'); $('connect').disabled = true; }

$('connect').onclick = () => guard('Connect', async () => {
  usbDev = await navigator.usb.requestDevice({ filters: [{ vendorId: 0x0451, productId: 0xE012 }] });
  await usbDev.open();
  if (!usbDev.configuration || usbDev.configuration.configurationValue !== 1) await usbDev.selectConfiguration(1);
  await usbDev.claimInterface(0);
  nsp = new Nspire(usbDev);
  log('Interface claimed. Waiting for the calculator to ask for an address...');
  try { await nsp.recvPacket(2500); log('Got the address request', 'ok'); }
  catch (e) {
    log('No request yet (' + e.message + '). Resetting the USB link and trying again.');
    try { await usbDev.reset(); } catch (er) { log('reset: ' + er.message, 'bad'); }
    try { await usbDev.claimInterface(0); } catch (er) { /* may still be claimed */ }
    nsp.pending = null;
    await nsp.recvPacket(8000);
    log('Got the address request', 'ok');
  }
  const p = nsp.newPacket(); p.data = [0x64, 0x01, 0xFF, 0x00];
  await nsp.sendPacket(p); nsp.hostSid = 0x8000;
  setStatus('Connected to the calculator', 'ok'); enable(true);
  log('Handshake sent. Try "Read device info" next.', 'ok');
});
$('info').onclick = () => guard('Device info', () => nsp.deviceInfo());
$('list').onclick = () => guard('List folder', () => nsp.listDir($('dirPath').value.trim() || '/'));
$('read').onclick = () => guard('Read file', async () => {
  const bytes = await nsp.readFile($('filePath').value.trim());
  log('Read ' + bytes.length + ' bytes: ' + dec.decode(bytes), 'ok');
});
$('write').onclick = () => guard('Write file', async () => {
  const path = $('filePath').value.trim(), text = $('fileText').value;
  await nsp.writeFile(path, enc.encode(text));
  log('Wrote ' + text.length + ' bytes to ' + path + '. Check the calculator\'s Documents screen.', 'ok');
});
$('diag').onclick = () => guard('Diagnostics', async () => {
  const tests = [
    ['/nsp6.tns', 'hello'],
    ['/nsp7.txt.tns', 'x'.repeat(300)],
    ['/ndless/nsp8.tns', 'hello']
  ];
  for (const [path, text] of tests) {
    log('--- writing ' + path + ' (' + text.length + ' bytes)');
    let failed = false;
    try { await nsp.writeFile(path, enc.encode(text)); log('upload confirmed', 'ok'); }
    catch (e) { log('write result: ' + e.message, 'bad'); failed = true; }
    if (failed && /timeout/.test(log.last || '')) break;
    try { const back = await nsp.readFile(path); log('read back ' + back.length + ' bytes: ' + dec.decode(back).slice(0, 20), 'ok'); }
    catch (e) { log('read-back: ' + e.message, 'bad'); failed = true; }
    if (failed) { nsp.connected = false; log('Stopping here. Reload the page and reconnect before trying again.', 'bad'); break; }
  }
  log('--- diagnostics done. Look on the calculator for files starting with nsp.', 'ok');
});
$('disconnect').onclick = async () => {
  try { await usbDev.close(); } catch (e) {}
  usbDev = nsp = null; enable(false); setStatus('Not connected'); log('Disconnected');
};
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(logEl.innerText); log('Log copied'); }
  catch (e) { log('Copy failed: ' + e.message, 'bad'); }
};
if ('usb' in navigator) navigator.usb.addEventListener('disconnect', e => {
  if (e.device === usbDev) { log('Calculator unplugged', 'bad'); usbDev = nsp = null; enable(false); setStatus('Not connected'); }
});
</script>
</body>
</html>
